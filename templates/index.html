<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .main-card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 15px; position: relative; }
        .platform-icon { font-size: 1.5rem; margin-right: 10px; }
        .developer-footer { font-size: 0.85rem; color: #aaa; margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .developer-name { color: #ffc107; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card main-card p-5 shadow-lg w-100" style="max-width: 600px;">
        <h2 class="text-center mb-4 text-warning">Media Downloader</h2>
        <p class="text-center text-muted mb-4">YouTube, TikTok ve Instagram linklerini yapıştırın</p>
        
        <form method="POST">
            <div class="mb-3">
                <label for="url" class="form-label">Video veya Medya Linki</label>
                <input type="url" class="form-control bg-dark text-white border-secondary" id="url" name="url" placeholder="https://..." required>
            </div>
            
            <div class="mb-4">
                <label class="form-label d-block">Format Seçin</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="format" id="mp4" value="mp4" checked>
                    <label class="form-check-label" for="mp4">🎬 MP4 (Video)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="format" id="mp3" value="mp3">
                    <label class="form-check-label" for="mp3">🎵 MP3 (Ses)</label>
                </div>
            </div>
            
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Dönüştür ve İndir</button>
        </form>
        
        <div class="mt-4 text-center text-muted fs-7">
            <span>Supported: YouTube • Instagram • TikTok</span>
        </div>

        <!-- Yapımcı İmza Alanı -->
        <div class="developer-footer text-center">
            © 2026 | Yapımcı: <span class="developer-name">Batun xd</span>
        </div>
    </div>
</div>

</body>
</html>
